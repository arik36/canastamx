
spring.application.name=domain-service
server.port=8081

# Lee el .env de la raíz. La ruta es relativa al directorio de trabajo, que
# debe ser services/domain-service: ahí se corren ./mvnw test y
# ./mvnw spring-boot:run (ver README.md). Las variables del sistema tienen
# prioridad; si el archivo no existe (CI), se omite.
spring.config.import=optional:file:../../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${OLTP_PORT:5432}/${OLTP_DB}
spring.datasource.username=${OLTP_USER}
spring.datasource.password=${OLTP_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
