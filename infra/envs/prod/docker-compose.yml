# CanastaMX — el despliegue en la VM de Oracle Cloud (ADR 008 · T054 · #201)
#
# Dueño: B (Ari Adair). Cómo se usa, paso por paso: infra/envs/prod/README.md.
#
# Se levanta EN LA VM, desde la raíz del repositorio y desde una terminal SIN
# ningún .env cargado: Docker Compose toma las variables de la terminal antes que
# del --env-file (lo que pasó el 15 de noviembre en #187).
#
#   docker compose -f infra/envs/prod/docker-compose.yml --env-file infra/envs/prod/.env up -d --build
#
# Lo que queda abierto hacia fuera es sólo Traefik, en el 80 y el 443, con el
# certificado de Let's Encrypt. Las bases y MinIO no publican ningún puerto: se
# alcanzan sólo dentro de la red de Compose. Dagster se publica en 127.0.0.1 de la
# VM, para entrar por un túnel SSH; desde fuera no se ve.
#
# Las imágenes se construyen en la propia VM, que es arm64 (Ampere A1). Todas las
# imágenes base existen para arm64; las de MinIO salen de nuestro espejo (ADR 012).

name: canastamx_prod

# Lo que comparten el servidor y el daemon de Dagster: la misma imagen, el mismo
# entorno y las mismas carpetas. Las corridas que pide el sensor las lanza el
# daemon; las que se piden desde la página, el servidor.
x-plataforma: &plataforma
  build:
    context: ../../..
    dockerfile: services/data-platform/Dockerfile
  image: canastamx/data-platform:prod
  restart: unless-stopped
  environment:
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    S3_BUCKET: ${S3_BUCKET}
    ANALYTICS_HOST: postgres-analytics
    ANALYTICS_PORT: "5432"
    ANALYTICS_DB: ${ANALYTICS_DB}
    ANALYTICS_USER: ${ANALYTICS_USER}
    ANALYTICS_PASSWORD: ${ANALYTICS_PASSWORD}
    CANASTAMX_SIMULAR: "0"
    CANASTAMX_LOTES: /datos/lotes
    CANASTAMX_CORRIDAS: /datos/corridas
    DAGSTER_HOME: /datos/dagster
  volumes:
    # Los lotes los copia una persona a una carpeta de la VM, fuera del repositorio.
    # La plataforma sólo los lee.
    - ${CARPETA_DE_LOTES:?falta CARPETA_DE_LOTES en infra/envs/prod/.env}:/datos/lotes:ro
    - corridas:/datos/corridas
    - dagster-home:/datos/dagster
    - ./dagster.yaml:/datos/dagster/dagster.yaml:ro
  depends_on:
    postgres-analytics:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
  networks: [canastamx]

services:

  # ── La puerta de enlace: la única que publica puertos ───────────────────────
  traefik:
    image: traefik:v3.6.2
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_CORREO:?falta ACME_CORREO en infra/envs/prod/.env}
      - --certificatesresolvers.letsencrypt.acme.storage=/certificados/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # Vacía, el servidor de producción de Let's Encrypt. Para ensayar sin gastar
      # su límite: https://acme-staging-v02.api.letsencrypt.org/directory
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_SERVIDOR:-https://acme-v02.api.letsencrypt.org/directory}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certificados:/certificados
    networks: [canastamx]

  # ── La web: https://<DIRECCION_PUBLICA> ──────────────────────────────────────
  web:
    build: ../../../clients/web
    image: canastamx/web:prod
    restart: unless-stopped
    environment:
      DOMINIO_URL: http://domain-service:8081
      ANALITICA_URL: http://analytics-api:8000
    depends_on: [domain-service]
    networks: [canastamx]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${DIRECCION_PUBLICA:?falta DIRECCION_PUBLICA en infra/envs/prod/.env}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
    mem_limit: 256m

  # ── El servicio de dominio: https://dominio.<DIRECCION_PUBLICA> ──────────────
  domain-service:
    build: ../../../services/domain-service
    image: canastamx/domain-service:prod
    restart: unless-stopped
    # La JVM toma el 75 % de este límite para su memoria, no el 25 % de toda la VM.
    mem_limit: 1g
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-oltp:5432/${OLTP_DB}
      OLTP_DB: ${OLTP_DB}
      OLTP_USER: ${OLTP_USER}
      OLTP_PASSWORD: ${OLTP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en infra/envs/prod/.env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    depends_on:
      postgres-oltp:
        condition: service_healthy
    networks: [canastamx]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dominio.rule=Host(`dominio.${DIRECCION_PUBLICA}`)"
      - "traefik.http.routers.dominio.entrypoints=websecure"
      - "traefik.http.routers.dominio.tls.certresolver=letsencrypt"
      - "traefik.http.services.dominio.loadbalancer.server.port=8081"

  # ── La interfaz analítica: https://analitica.<DIRECCION_PUBLICA> ─────────────
  analytics-api:
    build: ../../../services/analytics-api
    image: canastamx/analytics-api:prod
    restart: unless-stopped
    environment:
      ANALYTICS_HOST: postgres-analytics
      ANALYTICS_PORT: "5432"
      ANALYTICS_DB: ${ANALYTICS_DB}
      ANALYTICS_USER: ${ANALYTICS_USER}
      ANALYTICS_PASSWORD: ${ANALYTICS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DOMINIO_URL: http://domain-service:8081
    depends_on:
      postgres-analytics:
        condition: service_healthy
    networks: [canastamx]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.analitica.rule=Host(`analitica.${DIRECCION_PUBLICA}`)"
      - "traefik.http.routers.analitica.entrypoints=websecure"
      - "traefik.http.routers.analitica.tls.certresolver=letsencrypt"
      - "traefik.http.services.analitica.loadbalancer.server.port=8000"
    mem_limit: 384m

  # ── La plataforma de datos: el servidor de Dagster y su daemon ──────────────
  dagster-webserver:
    <<: *plataforma
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-m", "orquestacion.definiciones"]
    ports:
      # Sólo en la VM. Desde tu computadora: ssh -L 3000:localhost:3000 ubuntu@<IP>
      - "127.0.0.1:${DAGSTER_PUERTO:-3000}:3000"
    mem_limit: 768m

  dagster-daemon:
    <<: *plataforma
    command: ["dagster-daemon", "run", "-m", "orquestacion.definiciones"]
    mem_limit: 1536m

  # ── Las dos bases: sin puertos publicados ───────────────────────────────────
  postgres-oltp:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OLTP_USER}
      POSTGRES_PASSWORD: ${OLTP_PASSWORD:?falta OLTP_PASSWORD en infra/envs/prod/.env}
      POSTGRES_DB: ${OLTP_DB}
    volumes:
      - oltp-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OLTP_USER} -d ${OLTP_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [canastamx]
    mem_limit: 384m

  postgres-analytics:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ANALYTICS_USER}
      POSTGRES_PASSWORD: ${ANALYTICS_PASSWORD:?falta ANALYTICS_PASSWORD en infra/envs/prod/.env}
      POSTGRES_DB: ${ANALYTICS_DB}
    volumes:
      - analytics-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANALYTICS_USER} -d ${ANALYTICS_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [canastamx]
    mem_limit: 1024m

  # ── La capa cruda: MinIO, sin puertos publicados ────────────────────────────
  minio:
    image: canastamx/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?falta S3_ACCESS_KEY en infra/envs/prod/.env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?falta S3_SECRET_KEY en infra/envs/prod/.env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks: [canastamx]
    mem_limit: 512m

  # Crea el bucket y se apaga, como en desarrollo.
  minio-init:
    image: canastamx/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb --ignore-existing local/$${S3_BUCKET:?falta S3_BUCKET} &&
      echo 'Bucket' $$S3_BUCKET 'listo.'
      "
    networks: [canastamx]

volumes:
  oltp-data:
  analytics-data:
  minio-data:
  certificados:
  corridas:
  dagster-home:

networks:
  canastamx:
    driver: bridge
